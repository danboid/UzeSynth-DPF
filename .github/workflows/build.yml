name: build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

# A newer push to the same branch cancels a build that is still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          # Windows is cross-compiled with MinGW-w64: DPF's OpenGL UI needs
          # <GL/glext.h>, which Microsoft's compiler doesn't provide.
          # Wine runs the LV2 generator and the tests.
          - name: Windows
            os: ubuntu-24.04
            toolchain: cmake/mingw-w64-x86_64.cmake

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      WINEDEBUG: -all

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libgl-dev libdbus-1-dev

      - name: Install MinGW-w64 and Wine
        if: matrix.name == 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - uses: actions/upload-artifact@v6
        with:
          name: uzesynth-${{ matrix.name }}
          path: build/bin/
